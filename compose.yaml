services:
  api:
    image: ghcr.io/paulocvt/gratificai-api:latest
    build:
      context: ./mvp
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-}
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_PATH: /var/lib/gratificai/gratificai.sqlite
    volumes:
      - gratificai-data:/var/lib/gratificai
    expose:
      - "3001"
    restart: unless-stopped

  web:
    image: ghcr.io/paulocvt/gratificai-web:latest
    build:
      context: ./mvp
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  gratificai-data:
